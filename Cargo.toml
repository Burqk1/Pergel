[workspace]
resolver = "3"
members = ["crates/pergel-core", "crates/pergel-render", "crates/pergel-wasm", "src-tauri"]
default-members = ["crates/pergel-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Burqk1"]

[workspace.dependencies]
pergel-core = { path = "crates/pergel-core" }
pergel-render = { path = "crates/pergel-render" }
skia-safe = "0.153"
rstar = "0.13"
taffy = { version = "0.15", default-features = false, features = ["std", "flexbox", "grid", "taffy_tree"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
usvg = { version = "0.48", default-features = false }
imagesize = "0.14"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[profile.dev]
debug = false
