[package]
name = "pergel"
description = "Pergel - a fast design tool"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "pergel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { version = "3.5", features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
axum = { version = "0.8", features = ["ws"] }
schemars = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"
fontdb = { version = "0.24", default-features = false, features = ["fs", "memmap"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
futures-util = "0.3"
